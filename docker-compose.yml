services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  worker:
    build: ./worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: video-app
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      FFMPEG_ENCODER: ${FFMPEG_ENCODER:-h264_nvenc}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - minio

  ws-server:
    build: ./ws-server
    ports:
      - "4001:4001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WS_PORT: "4001"
    depends_on:
      - redis

volumes:
  minio-data:
