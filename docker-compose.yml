services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - D:/minio-data:/data  # Explicitly use D: drive

  worker:
    build: ./worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: video-app
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
    depends_on:
      - redis
      - minio

# Using bind mount to D:/minio-data instead of named volume
